<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO Bot — Procedimientos Internos</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4f8;
  --surface: #ffffff;
  --surface2: #e8eef5;
  --border: #c8d6e5;
  --accent: #0a3d8f;
  --accent2: #d42b2b;
  --accent3: #1a6e3c;
  --text: #0d1b2e;
  --text2: #3a5070;
  --text3: #6b88a8;
  --font: 'Sora', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

header {
  padding: 16px 32px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 50;
}
.logo {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: white;
}
.header-text h1 { font-size: 15px; font-weight: 600; }
.header-text p { font-size: 11px; color: var(--text2); margin-top: 1px; }
.back-btn {
  margin-left: auto;
  display: none;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  font-family: var(--font);
  transition: all 0.2s;
}
.back-btn:hover { color: var(--text); border-color: var(--accent); }
.back-btn.visible { display: flex; }

main { max-width: 800px; margin: 0 auto; padding: 28px 24px; }

/* AI SEARCH */
.ai-search-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 28px;
}
.ai-search-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--accent);
  font-family: var(--mono);
  margin-bottom: 10px;
}
.ai-input-row {
  display: flex;
  gap: 10px;
}
.ai-input-row textarea {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  resize: none;
  height: 42px;
  outline: none;
  transition: border-color 0.2s;
}
.ai-input-row textarea:focus { border-color: var(--accent); }
.ai-input-row textarea::placeholder { color: var(--text3); }
.ai-send-btn {
  padding: 0 18px;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  color: white;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
  white-space: nowrap;
}
.ai-send-btn:hover { opacity: 0.85; }
.ai-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.ai-response {
  margin-top: 14px;
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
  display: none;
}
.ai-response.visible { display: block; }
.ai-suggestion {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  padding: 8px 14px;
  background: var(--surface2);
  border: 1px solid var(--accent);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  color: var(--accent);
  cursor: pointer;
  transition: all 0.2s;
}
.ai-suggestion:hover { background: var(--accent); color: white; }
.ai-thinking { color: var(--text3); font-style: italic; font-size: 12px; }

.screen { display: none; animation: fadeIn 0.25s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.section-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 16px;
}
.categories-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 12px;
}
.category-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.category-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--card-color, var(--accent));
  opacity: 0;
  transition: opacity 0.2s;
}
.category-card:hover { border-color: var(--card-color, var(--accent)); transform: translateY(-2px); }
.category-card:hover::before { opacity: 1; }
.category-icon { font-size: 22px; margin-bottom: 8px; }
.category-title { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.4; }
.category-count { font-size: 10px; color: var(--text3); margin-top: 3px; font-family: var(--mono); }

.category-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.category-header-icon { font-size: 26px; }
.category-header-title { font-size: 17px; font-weight: 600; }

.subcategory-list { display: flex; flex-direction: column; gap: 10px; }
.subcategory-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.subcategory-btn:hover { border-color: var(--accent); background: var(--surface2); }
.subcategory-btn .arrow { color: var(--text3); font-size: 16px; transition: transform 0.2s; }
.subcategory-btn:hover .arrow { transform: translateX(4px); color: var(--accent); }

.answer-header {
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.answer-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--accent);
  font-family: var(--mono);
  margin-bottom: 6px;
}
.answer-question { font-size: 15px; font-weight: 600; line-height: 1.4; }
.answer-content {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  line-height: 1.8;
  font-size: 13px;
  color: var(--text);
}
.answer-content .step {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  align-items: flex-start;
}
.step-num {
  width: 22px; height: 22px;
  background: var(--accent);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0; margin-top: 1px;
}
.step-text { flex: 1; }
.answer-content .bullet { margin-bottom: 8px; padding-left: 16px; position: relative; }
.answer-content .bullet::before { content: '•'; position: absolute; left: 0; color: var(--accent); }
.cost-box {
  margin-top: 16px;
  padding: 12px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 12px;
  color: var(--text2);
}
.cost-box strong { color: var(--accent3); }
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  font-family: var(--mono);
  margin-right: 4px;
}
.tag-legal { background: rgba(10,61,143,0.12); color: #0a3d8f; }
.tag-comercial { background: rgba(212,43,43,0.12); color: #d42b2b; }
.tag-op { background: rgba(26,110,60,0.12); color: #1a6e3c; }
    .tag-dealer { background: rgba(100,60,180,0.12); color: #6438b0; font-weight:700; }
.tag-aac { background: rgba(180,120,0,0.12); color: #8a6000; }
.tag-teso { background: rgba(0,90,160,0.12); color: #005aa0; }
.divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.note { font-size: 11px; color: #3a5070; margin-top: 10px; font-style: italic; background: #fff3cd; border-left: 3px solid #e6a817; padding: 6px 10px; border-radius: 4px; }
.pending { color: var(--text3); font-style: italic; font-size: 13px; }
.etapa-btn {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 500;
  padding: 6px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.2s;
}
.etapa-btn:hover { border-color: var(--accent); color: var(--text); background: var(--surface); }
</style>
</head>
<body>

<header>
  <div class="logo">GO</div>
  <div class="header-text">
    <h1>GO Bot</h1>
    <p>Procedimientos internos · Global Go</p>
  </div>
  <button class="back-btn" id="back-btn" onclick="goBack()">← Volver</button>
</header>

<main>
  <!-- AI GUIDE -->
  <div class="ai-search-box">
    <div class="ai-search-label">✦ Asistente de búsqueda</div>
    <div class="ai-input-row">
      <textarea id="ai-input" placeholder="Describe tu consulta y te digo a dónde ir..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askAI();}"></textarea>
      <button class="ai-send-btn" id="ai-btn" onclick="askAI()">Consultar</button>
    </div>
    <div class="ai-response" id="ai-response"></div>
  </div>

  <!-- SCREEN: HOME -->
  <div class="screen active" id="screen-home">
    <p class="section-title">Categorías</p>
    <div class="categories-grid" id="categories-grid"></div>
  </div>

  <!-- SCREEN: SUB -->
  <div class="screen" id="screen-sub">
    <div class="category-header">
      <div class="category-header-icon" id="sub-icon"></div>
      <div class="category-header-title" id="sub-title"></div>
    </div>
    <div class="subcategory-list" id="subcategory-list"></div>
  </div>

  <!-- SCREEN: ANSWER -->
  <div class="screen" id="screen-answer">
    <div class="answer-header">
      <div class="answer-label" id="answer-label"></div>
      <div class="answer-question" id="answer-question"></div>
    </div>
    <div class="answer-content" id="answer-content"></div>
  </div>
</main>

<script>
const AK = 'sk-ant-api03-a4bzMoMwwfv6vAVdCk0KNkYQ5Jx2VYvlix8gOrJSvWwrXj9c1V3rGX4ldDVdMFs7Vdmz1MqMkuq2f-HRl5MHw-892BcQAA';

const CATS = [
  { id:"tive", icon:"📋", title:"TIVE Observada", color:"#6c63ff",
    items:[
      { q:"Pareja casada — el cónyuge no figuró en la TIVE",
        a:`<p>Error del registrador. Ambos ya figuran en el crédito (SIS360). <strong>Operaciones NO interviene.</strong> Nunca se retira al cónyuge del crédito por ley.</p><hr class="divider"><p><strong>Comercial consulta al cliente qué opción prefiere:</strong></p><div class="step"><div class="step-num">A</div><div class="step-text"><span class="tag tag-dealer">DEALER</span> Solicita rectificación en SUNARP adjuntando partida de matrimonio emitida por RENIEC. Sin costo de nueva GM. El plazo depende de SUNARP, Global Go no tiene responsabilidad.</div></div><div class="step"><div class="step-num">B</div><div class="step-text">Se firman <strong>DOS garantías mobiliarias</strong> — una con quien figura en la TIVE y otra con ambos cónyuges. Siempre hay costo por la segunda GM.</div></div><div class="cost-box"><strong>💰 Costo opción B:</strong> Lima S/120 · Provincia: según notaría local + S/4 SIGM · Lo asume dealer o cliente.</div>` },
      { q:"Cliente soltero en DNI pero en la TIVE apareció su cónyuge",
        a:`<p>SUNARP detectó que el cliente en realidad está casado. Legal no podía saberlo. Nunca se retira al cónyuge del crédito por ley.</p><hr class="divider"><div class="step"><div class="step-num">1</div><div class="step-text"><span class="tag tag-comercial">COMERCIAL</span> Envía acta de matrimonio a Legal (emitida o certificada por RENIEC, no se aceptan documentos de municipalidad) solicitando evaluación.</div></div><div class="step"><div class="step-num">2</div><div class="step-text"><span class="tag tag-legal">LEGAL</span> Verifica y le indica a Operaciones cómo agregar al cónyuge en SIS360.</div></div><div class="step"><div class="step-num">3</div><div class="step-text"><span class="tag tag-op">OPERACIONES</span> Modifica el crédito en SIS360.</div></div><div class="step"><div class="step-num">4</div><div class="step-text"><span class="tag tag-legal">LEGAL</span> Elabora adenda para regularizar estado civil. Firman ambos vía Firmalo.pe o Keynua.</div></div><div class="step"><div class="step-num">5</div><div class="step-text"><span class="tag tag-comercial">COMERCIAL</span> Persigue al cliente y cónyuge para que firmen la adenda.</div></div><div class="step"><div class="step-num">6</div><div class="step-text"><span class="tag tag-legal">LEGAL</span> Valida firma y solicita a AAC agendar cita de GM donde figuren ambos.</div></div><div class="step"><div class="step-num">7</div><div class="step-text"><span class="tag tag-aac">AAC</span> Agenda la cita de garantía.</div></div><div class="cost-box"><strong>💰 Costo:</strong> Si aún no se firmó GM: sin costo · Si ya se firmó: Lima S/120 · Provincia: según notaría + S/4 SIGM · Adenda sin costo.</div>` },
      { q:"Dos copropietarios solteros/divorciados/viudos — solo uno figuró en la TIVE",
        a:`<p>Comercial consulta al cliente qué opción prefiere:</p><div class="step"><div class="step-num">A</div><div class="step-text">Rectificación en SUNARP para que figuren ambos. Solo posible si en la boleta de venta figuran ambas personas. El plazo depende de SUNARP, Global Go no tiene responsabilidad.</div></div><div class="step"><div class="step-num">B</div><div class="step-text"><strong>(Más común)</strong> <span class="tag tag-comercial">COMERCIAL</span> solicita a Operaciones el retiro en SIS360 de quien no figuró. Luego: <span class="tag tag-op">OPERACIONES</span> modifica → <span class="tag tag-legal">LEGAL</span> elabora adenda → <span class="tag tag-comercial">COMERCIAL</span> persigue firma → <span class="tag tag-aac">AAC</span> agenda nueva cita de GM si ya se había firmado una.</div></div><div class="cost-box"><strong>💰 Costo:</strong> Si aún no se firmó GM: sin costo · Si ya se firmó: Lima S/120 · Provincia: según notaría + S/4 SIGM · Adenda sin costo.</div><p class="note">⚠️ Divorciado: acta de matrimonio (divorcio en el reverso). Viudo: acta de matrimonio + acta de defunción. Solo documentos emitidos por RENIEC.</p>` },
      { q:"Cliente declaró estar casado pero son convivientes — SUNARP inscribió la TIVE solo a nombre de uno",
        a:`<p>SUNARP detectó que en verdad no están casados entre sí. Se retira a quien no figuró.</p><hr class="divider"><p><strong>Comercial consulta al cliente qué opción prefiere:</strong></p><div class="step"><div class="step-num">A</div><div class="step-text"><strong>Rectificación de TIVE en SUNARP</strong> — solo si en la boleta de pago figuran ambos copropietarios: <span class="tag tag-dealer">DEALER</span> solicita la rectificación en SUNARP. Sin costo de nueva GM. El plazo depende de SUNARP, Global Go no tiene responsabilidad.</div></div><div class="step"><div class="step-num">B</div><div class="step-text"><strong>Retiro del que no figuró:</strong></div></div><div class="step"><div class="step-num">1</div><div class="step-text"><span class="tag tag-comercial">COMERCIAL</span> Solicita a Operaciones el retiro en SIS360 de quien no figuró.</div></div><div class="step"><div class="step-num">2</div><div class="step-text"><span class="tag tag-op">OPERACIONES</span> Modifica el crédito en SIS360.</div></div><div class="step"><div class="step-num">3</div><div class="step-text"><span class="tag tag-legal">LEGAL</span> Elabora adenda y la envía a <strong>Firmalo.pe o Keynua</strong> para firma.</div></div><div class="step"><div class="step-num">4</div><div class="step-text"><span class="tag tag-comercial">COMERCIAL</span> Persigue la firma del cliente.</div></div><div class="step"><div class="step-num">5</div><div class="step-text"><span class="tag tag-aac">AAC</span> Agenda nueva cita de GM si ya se había firmado una.</div></div><div class="cost-box"><strong>💰 Costo:</strong> Si aún no se firmó GM: sin costo · Si ya se firmó: Lima S/120 · Provincia: según notaría + S/4 SIGM · Adenda sin costo.</div>` },
      { q:"Cliente con separación de patrimonios — el cónyuge apareció en la TIVE",
        a:`<p>Comercial consulta al cliente qué opción prefiere:</p><div class="step"><div class="step-num">A</div><div class="step-text">Dealer solicita rectificación en SUNARP adjuntando partida de separación de patrimonios. El plazo depende de SUNARP, Global Go no tiene responsabilidad.</div></div><div class="step"><div class="step-num">B</div><div class="step-text">Se incluye al cónyuge en todo: <span class="tag tag-op">OPERACIONES</span> lo agrega en SIS360 → <span class="tag tag-legal">LEGAL</span> elabora adenda y la envía a <strong>Firmalo.pe o Keynua</strong> para firma → <span class="tag tag-comercial">COMERCIAL</span> persigue firmas → <span class="tag tag-aac">AAC</span> agenda nueva cita de GM.</div></div><div class="cost-box"><strong>💰 Costo:</strong> Si aún no se firmó GM: sin costo · Si ya se firmó: Lima S/120 · Provincia: según notaría + S/4 SIGM · Adenda sin costo.</div>` }
    ]
  },
  { id:"agregar", icon:"👥", title:"Agregar o Quitar Alguien al Crédito", color:"#ff6584",
    items:[
      { q:"¿Cuándo se puede retirar a alguien del crédito?",
        a:`<p><strong>Regla absoluta:</strong> Si los clientes son casados, JAMÁS se retira a ninguno del crédito por ley.</p><hr class="divider"><p>El retiro en SIS360 SOLO aplica para:</p><div class="bullet">Copropietarios solteros</div><div class="bullet">Divorciados — acreditar con acta de matrimonio (el divorcio figura en el reverso), emitida por RENIEC</div><div class="bullet">Viudos — acreditar con acta de matrimonio + acta de defunción, ambos emitidos por RENIEC</div><hr class="divider"><p><span class="tag tag-comercial">COMERCIAL</span> presenta los documentos a Legal para verificación antes de proceder.</p>` },
      { q:"¿Cómo se agrega a alguien al crédito?",
        a:`<div class="step"><div class="step-num">1</div><div class="step-text"><span class="tag tag-comercial">COMERCIAL</span> Envía a Legal el acta de matrimonio (si son casados) o documentos que acrediten la relación, emitidos por RENIEC. Solicita evaluación de cómo agregar a esa persona.</div></div><div class="step"><div class="step-num">2</div><div class="step-text"><span class="tag tag-legal">LEGAL</span> Analiza si los documentos adjuntados (acta de matrimonio u otros) son válidos. Si lo son, da luz verde a Operaciones para que agregue o quite a la persona en SIS360.</div></div><div class="step"><div class="step-num">3</div><div class="step-text"><span class="tag tag-op">OPERACIONES</span> Agrega a la persona en SIS360.</div></div><div class="step"><div class="step-num">4</div><div class="step-text"><span class="tag tag-legal">LEGAL</span> Elabora adenda al contrato. Firman ambos vía Firmalo.pe o Keynua.</div></div><div class="step"><div class="step-num">5</div><div class="step-text"><span class="tag tag-comercial">COMERCIAL</span> Persigue las firmas.</div></div><div class="step"><div class="step-num">6</div><div class="step-text"><span class="tag tag-aac">AAC</span> Agenda cita de GM una vez Legal lo solicite.</div></div><p class="note">Solo se aceptan documentos emitidos o certificados por RENIEC. Nunca documentos de municipalidad.</p>` }
    ]
  },
  { id:"dni", icon:"🪪", title:"Problemas con DNI o CE", color:"#43e97b",
    items:[
      { q:"DNI vencido — ¿puede firmar?",
        a:`<p>Con DOI vencido aplican reglas distintas según el tipo de documento y si es para garantía o contrato/adenda.</p>
<hr class="divider">
<p><strong>🔏 FIRMA DE GARANTÍA con DOI vencido:</strong></p>
<div class="bullet"><strong>Peruanos — Lima (DNI vencido):</strong> Se acepta siempre que el cliente pase biométrico. Sin costo adicional.</div>
<div class="bullet"><strong>Peruanos — Provincia (DNI vencido):</strong> <span class="tag tag-comercial">COMERCIAL</span> notifica por el grupo de WhatsApp de la región correspondiente para consultar si la notaría lo acepta, si hay algún costo extra o documento adicional que llevar. Esperar respuesta antes de agendar la cita.</div>
<div class="bullet"><strong>Extranjeros — Lima y Provincia (CE vencido):</strong> Debe sacar nuevo CE vigente sí o sí, sin excepción. No hay alternativa.</div>
<hr class="divider">
<p><strong>📄 FIRMA DE CONTRATO O ADENDA con DOI vencido:</strong></p>
<div class="bullet"><strong>Peruanos — Lima (DNI vencido):</strong> Se acepta siempre que el cliente pase biométrico. Costo S/120 a COOPAC.</div>
<div class="bullet"><strong>Peruanos — Provincia (DNI vencido):</strong> Consultar primero con Legal antes de proceder.</div>
<div class="bullet"><strong>Extranjeros (CE vencido):</strong> Debe sacar nuevo CE vigente sí o sí.</div>
<hr class="divider">
<p><strong>Flujo firma presencial de contrato o adenda — solo si Legal confirma que procede:</strong></p>
<div class="step"><div class="step-num">1</div><div class="step-text"><span class="tag tag-comercial">COMERCIAL</span> Envía correo a Legal, AAC y Tesorería describiendo el motivo y adjunta el voucher de pago.</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text"><span class="tag tag-teso">TESORERÍA</span> Valida el pago primero.</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text"><span class="tag tag-aac">AAC</span> Agenda la cita y <span class="tag tag-legal">LEGAL</span> coordina con la notaría una vez validado el pago.</div></div>
<p class="note">⚠️ Solo Legal habla con las notarías. El cliente nunca se contacta directamente.</p>
<p class="note">⚠️ Firma de contrato ≠ Firma de GM. La entrega de la moto SOLO se autoriza con la GM firmada.</p>` },
      { q:"DNI deteriorado o roto — ¿puede firmar?",
        a:`<p>Con DNI o CE deteriorado, <strong>primero intentar firma digital</strong> por Firmalo.pe o Keynua (a veces lo aceptan igual).</p>
<hr class="divider">
<div class="bullet">Si funciona en plataforma digital: continúa el proceso normal.</div>
<div class="bullet">Si no funciona: proceder con firma presencial según el caso.</div>
<hr class="divider">
<p><strong>🔏 FIRMA DE GARANTÍA con DOI deteriorado/roto:</strong></p>
<div class="bullet"><strong>Lima (DNI o CE deteriorado):</strong> Se acepta siempre que el cliente pase biométrico. Sin costo adicional.</div>
<div class="bullet"><strong>Provincia (DNI o CE deteriorado):</strong> <span class="tag tag-comercial">COMERCIAL</span> notifica por el grupo de WhatsApp de la región correspondiente para consultar si la notaría lo acepta, si hay algún costo extra o documento adicional que llevar. Esperar respuesta antes de agendar la cita.</div>
<hr class="divider">
<p><strong>📄 FIRMA DE CONTRATO O ADENDA con DOI deteriorado/roto:</strong></p>

<div class="bullet"><strong>Provincia:</strong> Consultar primero con Legal antes de proceder.</div>
<hr class="divider">
<p><strong>Flujo firma presencial de contrato o adenda — solo si Legal confirma que procede:</strong></p>
<div class="step"><div class="step-num">1</div><div class="step-text"><span class="tag tag-comercial">COMERCIAL</span> Envía correo a Legal, AAC y Tesorería describiendo el motivo y adjunta el voucher de pago.</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text"><span class="tag tag-teso">TESORERÍA</span> Valida el pago primero.</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text"><span class="tag tag-aac">AAC</span> Agenda la cita y <span class="tag tag-legal">LEGAL</span> coordina con la notaría una vez validado el pago.</div></div>
<p class="note">⚠️ Solo Legal habla con las notarías. El cliente nunca se contacta directamente.</p>
<p class="note">⚠️ Costo S/120 a COOPAC para contrato o adenda. La GM no tiene costo adicional para el cliente.</p>` },
      { q:"DNI perdido o extraviado — ¿puede firmar?",
        a:`<p>Con DNI o CE perdido o robado, directamente <strong>firma presencial</strong>. No intentar plataforma digital.</p>
<hr class="divider">
<p><strong>🔏 FIRMA DE GARANTÍA con DOI perdido/robado:</strong></p>
<div class="bullet"><strong>Lima:</strong> Legal envía al notario la foto del DOI del cliente subido al sistema para que proceda la identificación. Se acepta siempre que el cliente pase biométrico. Sin costo adicional.</div>
<div class="bullet"><strong>Provincia:</strong> <span class="tag tag-comercial">COMERCIAL</span> notifica por el grupo de WhatsApp de la región correspondiente para consultar si la notaría lo acepta, si hay algún costo extra o documento adicional. Esperar respuesta antes de agendar la cita.</div>

<div class="step"><div class="step-num">2</div><div class="step-text"><span class="tag tag-teso">TESORERÍA</span> Valida el pago primero.</div></div>

<div class="step"><div class="step-num">4</div><div class="step-text"><span class="tag tag-aac">AAC</span> Agenda la cita una vez Legal confirme.</div></div>

  { id:"cronograma", icon:"📊", title:"Cronograma Errado / SOAT", color:"#ffc850",
    items:[
      { q:"El cliente indica que su cronograma tiene errores",
        a:`<p>Derivar la consulta a <span class="tag tag-op">OPERACIONES</span> para que verifiquen si hay error real.</p>
<p class="note">⚠️ Legal no puede modificar el cronograma ni la hoja informativa, eso solo lo hace Operaciones.</p>
<hr class="divider">
<p><strong>Si Operaciones confirma que NO hay error:</strong></p>
<div class="bullet"><span class="tag tag-comercial">COMERCIAL</span> aclara al cliente que el cronograma es correcto y debe firmarlo tal como está.</div>
<hr class="divider">
<p><strong>Si Operaciones confirma que SÍ hay error — según etapa:</strong></p>
<div class="bullet"><strong>El cliente AÚN NO firmó el contrato:</strong> Operaciones corrige la información. Legal reenvía el contrato por Firmalo.pe o Keynua para que el cliente lo firme. Sin adenda.</div>
<div class="bullet"><strong>Ya firmó contrato, pero NO ha firmado la GM:</strong> Operaciones notifica cambios a Legal. Legal elabora adenda y la envía por Firmalo.pe o Keynua. Cliente firma. No se necesita nueva GM.</div>
<div class="bullet"><strong>Ya firmó contrato Y ya firmó GM:</strong> Operaciones notifica cambios a Legal. Legal elabora adenda, cliente firma. Legal solicita a <span class="tag tag-aac">AAC</span> nueva cita de firma de GM (el cronograma con fechas figura en la garantía).</div>` },
      { q:"El SOAT no figura en el contrato",
        a:`<p>El SOAT lo maneja <span class="tag tag-op">OPERACIONES</span>. Legal NO puede modificar cronograma ni hoja informativa. Derivar la consulta a Operaciones.</p><hr class="divider"><div class="bullet"><strong>Antes de cualquier firma:</strong> Operaciones hace el cambio, sin costo.</div><div class="bullet"><strong>Ya se firmó contrato y/o garantía:</strong> El cliente deberá firmar documentos nuevos.</div><div class="bullet"><strong>Operaciones confirma que no hay modificación:</strong> El cliente continúa sin problemas.</div><div class="bullet"><strong>Ya firmó contrato pero NO la GM:</strong> Solo adenda, no nueva legalización.</div><div class="cost-box"><strong>💰</strong> Si el error es del cliente/dealer, ellos asumen el costo. Adenda sin costo.</div>` }
    ]

  { id:"contrato", icon:"✍️", title:"Firma del Contrato", color:"#50c8ff",
    items:[
      { q:"¿Por qué el cliente no puede firmar por Firmalo.pe o Keynua?",
        a:`<p>Puede no estar disponible por:</p><div class="bullet">Restricciones del sistema.</div><div class="bullet">Problemas de validación de identidad del cliente.</div><div class="bullet">El tipo de documento requiere firma presencial.</div><hr class="divider"><p>Verificar con <span class="tag tag-op">OPERACIONES</span> el motivo específico.</p><p class="note">⚠️ Solo Legal habla con las notarías.</p>` },

  { id:"garantia", icon:"🏍️", title:"Entrega de la Moto", color:"#ff9f43",
    items:[
      { q:"¿Cuándo se autoriza la entrega de la moto?",
        a:`<p>La autorización de entrega la da <strong>Legal</strong> colocando un comentario en el <strong>SIS360</strong>. No basta con que el cliente diga que ya firmó — Legal requiere la validación de la notaría, ya que solo el personal notarial sabe si el cliente pasó biométrico correctamente, si firmó todas las páginas requeridas y si la firma es conforme a su DOI. El cliente no tiene visibilidad de todo eso.</p>
<hr class="divider">
<p><strong>🏙️ Lima:</strong></p>
<div class="bullet">Legal inscribe la GM en el <strong>SIGM (Sistema Informativo de Garantías Mobiliarias)</strong> — página de SUNARP — dentro de las <strong>24 horas</strong> de realizada la firma del cliente en la notaría (Ate, Surquillo o Comas). Una vez inscrita, Legal coloca en el SIS360 el comentario: <em>"GARANTIA PRESENTADA A REGISTROS PÚBLICOS. ENTREGAR MOTO"</em>.</div>
<div class="bullet">Si el SIGM falla (página de SUNARP caída), se avisará por los canales de WhatsApp. El plazo se puede extender hasta que se resuelva, pero no depende de Legal.</div>
<hr class="divider">
<p><strong>🗺️ Provincia:</strong></p>
<div class="bullet">La notaría de provincia debe confirmar a Legal que la firma del cliente fue válida. Apenas Legal recibe esa confirmación, coloca en el SIS360 el comentario: <em>"GARANTIA FIRMADA / ENTREGAR MOTO"</em> y se debe enviar: <strong>Acta de Entrega de Moto, TIVE y Acta de Entrega de Placa</strong>.</div>
<div class="bullet">Se pide paciencia, ya que cada notaría en provincia trabaja a un ritmo distinto.</div>
<hr class="divider">
<p class="note">⚠️ Solo Legal se comunica con las notarías de provincia. Los asesores comerciales no deben contactar ni presionar al personal notarial — eso genera malestar con la notaría. De preferencia, los asesores tampoco deben estar presentes en la notaría.</p>
<p class="note">⚠️ No basta con que el cliente diga que ya firmó. Se requiere la validación de la notaría. Solo el personal notarial puede confirmar si el cliente pasó biométrico correctamente, firmó todas las páginas requeridas y si la firma es conforme a su DOI — el cliente no tiene visibilidad de nada de eso.</p>
<p class="note">⚠️ La entrega SOLO se autoriza con la GM firmada y validada. El contrato solo no es suficiente.</p>` },
    ]
  },
  { id:"cambio", icon:"🏍️", title:"Cambio de Unidad", color:"#a29bfe",

      { q:"Se entregó un vehículo distinto al declarado",
        a:`<div class="step"><div class="step-num">1</div><div class="step-text">Enviar boleta con datos del nuevo vehículo a <span class="tag tag-op">OPERACIONES</span>.</div></div><div class="step"><div class="step-num">2</div><div class="step-text"><span class="tag tag-op">OPERACIONES</span> Valida que el vehículo puede ser financiado y confirma si se debe modificar hoja informativa o cronograma.</div></div><div class="step"><div class="step-num">3</div><div class="step-text">Con modificación: <span class="tag tag-legal">LEGAL</span> envía adenda. Sin modificación: Operaciones solo cambia la boleta.</div></div><div class="step"><div class="step-num">4</div><div class="step-text">Si ya se firmó garantía con datos erróneos: pago de nueva legalización. Constancia a Legal y Tesorería. Tesorería valida. Legal modifica y coordina con notaría. AAC indica fecha.</div></div><hr class="divider"><div class="bullet"><strong>Provincia:</strong> Basta boleta nueva.</div><div class="bullet"><strong>Lima:</strong> Boleta nueva + TIVE con datos correctos.</div><div class="cost-box"><strong>💰</strong> Si ya se firmó GM: Lima S/120 · Provincia según notaría + S/4 SIGM. Si se reportó antes de la firma: sin costo.</div><p class="note">⚠️ Copiar: AAC, Operaciones, Legal y Tesorería. Si el error es del dealer: incluir Auditoría al Dealer.</p>` }
    ]

function showScreen(id) {
  function handleParejaEstadoCivil(tipo) {
    const resp = document.getElementById('ai-response');
    const cat = CATS.find(c => c.id === 'tive');
    if (tipo === 'casados') {
      // Son casados → TIVE idx:0 (cónyuge no figuró)
      const item = cat.items[0];
      resp.innerHTML = `<p>Entendido, son casados. ¿En qué etapa está el proceso?</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
          <button class="etapa-btn" onclick="setEtapa('ninguna', 'tive', 0)">📋 Aún no firma nada</button>
          <button class="etapa-btn" onclick="setEtapa('contrato', 'tive', 0)">📄 Solo firmó contrato</button>
          <button class="etapa-btn" onclick="setEtapa('gm_sin_tive', 'tive', 0)">🔏 Firmó garantía sin TIVE (provincia)</button>
          <button class="etapa-btn" onclick="setEtapa('gm_con_tive', 'tive', 0)">🚗 Firmó garantía con TIVE (Lima)</button>
        </div>`;
    } else {
      // Son convivientes/novios → TIVE idx:3
      const item = cat.items[3];
      resp.innerHTML = `<p>Entendido. ¿En qué etapa está el proceso?</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
          <button class="etapa-btn" onclick="setEtapa('ninguna', 'tive', 3)">📋 Aún no firma nada</button>
          <button class="etapa-btn" onclick="setEtapa('contrato', 'tive', 3)">📄 Solo firmó contrato</button>
          <button class="etapa-btn" onclick="setEtapa('gm_sin_tive', 'tive', 3)">🔏 Firmó garantía sin TIVE (provincia)</button>
          <button class="etapa-btn" onclick="setEtapa('gm_con_tive', 'tive', 3)">🚗 Firmó garantía con TIVE (Lima)</button>
        </div>`;
    }
  }

  // ======= CLIENTES EJECUTADOS =======
  let ejecutadosData = [];
  let ejecutadosCargado = false;

  function normalizarPlaca(p) {
    const clean = (p || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    if (clean.length >= 6) return clean.slice(0, 4) + '-' + clean.slice(4, 6);
    return (p || '').trim().toUpperCase();
  }

  async function cargarEjecutados() {
    if (ejecutadosCargado) return;
    try {
      const resp = await fetch('https://raw.githubusercontent.com/GOBOT-LEG/GOBOT/main/ESTADO_CLIENTES_CRITICOS_FINAL_PUBLICO.csv');
      const text = await resp.text();
      const rows = text.split('\n').map(r => r.split(';'));
      const headers = rows[0];
      const iCliente = headers.findIndex(h => h.trim().toUpperCase().includes('CLIENTES'));
      const iDoi = headers.findIndex(h => h.trim().toUpperCase().includes('DOI'));
      const iPlaca = headers.findIndex(h => h.trim().toUpperCase().includes('PLACA'));

      ejecutadosData = rows.slice(1).filter(r => r.length >= 3 && (r[iCliente] || '').trim()).map(r => ({
        cliente: (r[iCliente] || '').trim(),
        doi: (r[iDoi] || '').trim(),
        placa: normalizarPlaca((r[iPlaca] || '').trim())
      })).filter(r => r.cliente);

      ejecutadosCargado = true;
      console.log('Ejecutados cargados:', ejecutadosData.length);
    } catch(e) {
      console.error('Error cargando ejecutados:', e);
    }
  }

  async function filtrarEjecutados() {
    const res = document.getElementById('ejecutados-resultado');
    if (!res) return;

    const raw = (document.getElementById('ejecutados-search')?.value || '').trim();
    if (!raw) { res.innerHTML = ''; return; }

    // Cargar si aún no se ha cargado
    if (!ejecutadosCargado) {
      res.innerHTML = '<p style="font-size:13px;color:var(--text2);">Cargando datos...</p>';
      await cargarEjecutados();
    }

    if (ejecutadosData.length === 0) {
      res.innerHTML = '<p style="font-size:13px;color:#d42b2b;">No se pudieron cargar los datos. Verifica tu conexión.</p>';
      return;
    }

    const qNombre = raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const qDoi = raw.replace(/[^0-9]/g,'');
    const qPlaca = raw.replace(/[^a-zA-Z0-9]/g,'').toUpperCase();

    const filtered = ejecutadosData.filter(r => {
      const nombre = r.cliente.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const doi = r.doi.replace(/[^0-9]/g,'');
      const placa = r.placa.replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
      return nombre.includes(qNombre) ||
             (qDoi.length >= 4 && doi.includes(qDoi)) ||
             (qPlaca.length >= 4 && placa.includes(qPlaca));
    });

    if (filtered.length === 0) {
      res.innerHTML = '<p style="font-size:13px;color:var(--text2);">No se encontró ningún cliente con ese criterio.</p>';
      return;
    }

    let html = filtered.length > 1 ? `<p style="font-size:12px;color:var(--text2);margin-bottom:8px;">${filtered.length} resultados:</p>` : '';
    filtered.forEach(r => {
      html += `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;">
        <p style="font-weight:700;font-size:13px;margin:0 0 4px;color:var(--text);">${r.cliente}</p>
        <p style="font-size:12px;margin:0;color:var(--text2);">DOI: <strong>${r.doi}</strong> &nbsp;·&nbsp; Placa: <strong>${r.placa}</strong></p>
      </div>`;
    });
    res.innerHTML = html;
  }

  // Cargar ejecutados al cualquier clic que muestre ese apartado
  document.addEventListener('click', function() {
    setTimeout(function() {
      const container = document.getElementById('ejecutados-container');
      const search = document.getElementById('ejecutados-search');
      if (container && search && ejecutadosData.length === 0) {
        cargarEjecutados();
      }
    }, 150);
  });

  // Precargar ejecutados al inicio
  window.addEventListener('load', function() {
    setTimeout(cargarEjecutados, 500);
  });

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  document.getElementById('back-btn').classList.toggle('visible', id!=='home');
}

function goBack() {
  if (!hist.length) return;
  const prev = hist.pop();
  if (prev==='home') { showScreen('home'); document.getElementById('back-btn').classList.remove('visible'); }
  else if (prev.startsWith('sub:')) openCategory(prev.replace('sub:',''), false);
}

function openCategory(catId, push=true) {
  if (push) hist.push('home');
  const cat = CATS.find(c=>c.id===catId);
  document.getElementById('sub-icon').textContent = cat.icon;
  document.getElementById('sub-title').textContent = cat.title;
  const list = document.getElementById('subcategory-list');
  list.innerHTML = '';
  cat.items.forEach((item,idx) => {
    const btn = document.createElement('button');
    btn.className = 'subcategory-btn';
    btn.innerHTML = `<span>${item.q}</span><span class="arrow">→</span>`;
    btn.onclick = () => openAnswer(catId, idx);
    list.appendChild(btn);
  });
  showScreen('sub');
}

function openAnswer(catId, idx, push=true) {
  if (push) hist.push('sub:'+catId);
  const cat = CATS.find(c=>c.id===catId);
  const item = cat.items[idx];
  document.getElementById('answer-label').textContent = cat.title;
  document.getElementById('answer-question').textContent = item.q;
  document.getElementById('answer-content').innerHTML = item.a;
  showScreen('answer');
}

    { catId:'notarias', idx:2, keys:['notaria provincia','notarias provincia','costo provincia notaria','notarias de provincia','cuanto cobra notaria provincia'] },

  { catId:'ejecutados', idx:0, keys:['cliente ejecutado','ejecutado','ejecutados','gm inscrita','inscrito','clientes ejecutados','buscar ejecutado','ver ejecutados','lista ejecutados','clientes morosos','mora ejecutada'] },
  { catId:'costos', idx:0, keys:['costo','cuanto cuesta','precio','cuanto es','cuanto cobran','tarifa','monto','cuanto pago','cuanto se paga','cuanto vale','s/120','120 soles','precio firma','costo firma','costo garantia','costo adenda','costo contrato'] },
  { catId:'ruc', idx:0, keys:['ruc','razon social','global go ruc','coopac ruc','global factoring','ruc de','cual es el ruc','ruc empresa','numero ruc','datos empresa','razon social de'] },
    { catId:'empresas', idx:0, keys:['cuenta coopac','datos coopac','coopac cuenta','interbank coopac','depositar coopac','cuenta provincia','numero cuenta','cci coopac'] },
    { catId:'notarias', idx:0, keys:['notaria lima','quintanilla','notaria ate','notaria surquillo','notaria comas','horario lima'] },
    { catId:'notarias', idx:1, keys:['notaria canete','canete','camacho'] },
    { catId:'notarias', idx:2, keys:['notaria san martin','lamas','tarapoto','juanjui','moyobamba'] },
    { catId:'notarias', idx:3, keys:['notaria piura','piura','sullana'] },
    { catId:'notarias', idx:4, keys:['notaria ica','ica','chincha'] },
    { catId:'notarias', idx:5, keys:['notaria trujillo','trujillo','casa grande','laredo','la libertad'] },
    { catId:'notarias', idx:6, keys:['notaria chiclayo','chiclayo','lambayeque','ferrenafe','ferrañafe'] },
    { catId:'notarias', idx:7, keys:['notaria cajamarca','cajamarca'] },
    { catId:'notarias', idx:8, keys:['notaria pucallpa','pucallpa','ucayali'] },
    { catId:'notarias', idx:9, keys:['notaria iquitos','iquitos','loreto'] },
    { catId:'notarias', idx:10, keys:['notaria puerto maldonado','puerto maldonado','madre de dios','pantigoso'] },
    { catId:'notarias', idx:11, keys:['notaria huacho','huacho','huaral'] },
    { catId:'notarias', idx:12, keys:['notaria chimbote','chimbote'] },
    { catId:'notarias', idx:13, keys:['notaria huanuco','huanuco'] },
    { catId:'notarias', idx:14, keys:['notaria jaen','jaen'] },
    { catId:'notarias', idx:15, keys:['notaria ayacucho','ayacucho'] },
    { catId:'notarias', idx:16, keys:['notaria huancayo','huancayo','la merced','tarma','jauja','junin'] },
    { catId:'notarias', idx:17, keys:['notaria huaraz','huaraz'] },
    { catId:'notarias', idx:18, keys:['notaria arequipa','arequipa'] },
    { catId:'notarias', idx:19, keys:['notaria bagua','bagua'] },
  ];

  let best = null;
  let bestScore = 0;

  RULES.forEach(rule => {
    rule.keys.forEach(k => {
      if (q.includes(k)) {
        const score = k.length;
        if (score > bestScore) {
          bestScore = score;
          best = rule;
        }
      }
    });
  });

  if (best) {
    const cat = CATS.find(c => c.id === best.catId);
    const item = cat.items[best.idx];

    // DNI: detectar si ya menciono contrato o garantia en la pregunta
    if (best.catId === 'dni') {
      const qOrig = document.getElementById('ai-input').value.toLowerCase();
      const mencionaGarantia = ['garantia','garantía','gm','garantia mobiliaria'].some(k => qOrig.includes(k));
      const mencionaContrato = ['contrato','firmar contrato'].some(k => qOrig.includes(k));
      if (mencionaGarantia) {
        setEtapa('gm_sin_tive', best.catId, best.idx);
        return;
      } else if (mencionaContrato) {
        setEtapa('contrato', best.catId, best.idx);
        return;
      }
      resp.innerHTML = `<p>Entendido! ¿Qué documento necesita firmar?</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
          <button class="etapa-btn" onclick="setEtapa('contrato', '${best.catId}', ${best.idx})">📄 Para firmar el contrato</button>
          <button class="etapa-btn" onclick="setEtapa('gm_sin_tive', '${best.catId}', ${best.idx})">🔏 Para firmar la garantía</button>
        </div>`;
    // PAREJA ambigua: preguntar si son casados o convivientes/novios
    } else if (best.catId === '_pareja') {
      resp.innerHTML = `<p>Para darte la respuesta correcta, necesito saber:</p>
        <p style="font-size:12px;color:var(--text2);margin:10px 0 8px;">¿Cuál es el estado civil de la pareja?</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          <button class="etapa-btn" onclick="handleParejaEstadoCivil('casados')">💍 Son casados</button>
          <button class="etapa-btn" onclick="handleParejaEstadoCivil('convivientes')">👫 Son convivientes / novios / solteros</button>
        </div>`;
    // TIVE y agregar: preguntar etapa completa
    } else if (['tive','agregar','cronograma','cambio'].includes(best.catId)) {
      resp.innerHTML = `<p>Entendido! Antes de mostrarte el apartado, dime:</p>
        <p style="font-size:12px;color:var(--text2);margin:10px 0 8px;">¿En qué etapa está el proceso?</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          <button class="etapa-btn" onclick="setEtapa('ninguna', '${best.catId}', ${best.idx})">📋 Aún no firma nada</button>
          <button class="etapa-btn" onclick="setEtapa('contrato', '${best.catId}', ${best.idx})">📄 Solo firmó contrato</button>
          <button class="etapa-btn" onclick="setEtapa('gm_sin_tive', '${best.catId}', ${best.idx})">🔏 Firmó garantía sin TIVE (provincia)</button>
          <button class="etapa-btn" onclick="setEtapa('gm_con_tive', '${best.catId}', ${best.idx})">🚗 Firmó garantía con TIVE (Lima)</button>
        </div>`;
    } else {
      resp.innerHTML = `<p>¡Encontré el apartado para tu consulta!</p>
        <div class="ai-suggestion" onclick="hist=['home']; openAnswer('${best.catId}', ${best.idx})">
          ${cat.icon} ${cat.title} → ${item.q}
        </div>`;
    }
  } else {
    resp.innerHTML = `<p>No encontré un apartado exacto para esa consulta. Prueba navegando por las categorías o consulta directamente con el área correspondiente.</p>`;
  }
  input.value = '';
}

function setEtapa(etapa, catId, idx) {
  const cat = CATS.find(c => c.id === catId);
  const item = cat.items[idx];
  const resp = document.getElementById('ai-response');

  // Redirigir segun etapa y categoria
  let finalCatId = catId;
  let finalIdx = idx;
  let msg = '';

  if (catId === 'dni') {
    // Mensajes especificos para DNI
    if (etapa === 'contrato') {
      msg = '📄 Para firmar el contrato con DNI vencido, roto o perdido — revisa el apartado para ver si puede firmar digital o debe ir presencialmente:';
    } else if (etapa === 'gm_sin_tive' || etapa === 'gm_con_tive') {
      msg = '🔏 Para firmar la garantía mobiliaria — revisa el apartado, ahí encontrarás si se acepta el DNI en ese estado y qué hacer:';
    }
  } else if (etapa === 'ninguna') {
    if (catId === 'tive') { finalCatId = 'agregar'; finalIdx = 1; }
    msg = '📋 Aún no firmó nada — no habrá costo de nueva legalización. Aquí están los pasos a seguir:';
  } else if (etapa === 'contrato') {
    if (catId === 'tive') { finalCatId = 'agregar'; finalIdx = 1; }
    msg = '📄 Solo firmó contrato — no se requiere nueva legalización de garantía, solo adenda si corresponde. Aquí están los pasos:';
  } else if (etapa === 'gm_sin_tive') {
    msg = '🔏 Firmó garantía sin TIVE (provincia) — si se requiere corrección, habrá costo de nueva legalización. Aquí están los pasos y costos:';
  } else if (etapa === 'gm_con_tive') {
    msg = '🚗 Firmó garantía con TIVE (Lima) — si se requiere corrección, habrá costo de nueva legalización. Aquí están los pasos y costos:';
  }

  const finalCat = CATS.find(c => c.id === finalCatId);
  const finalItem = finalCat.items[finalIdx];

  resp.innerHTML = `<p>${msg}</p>
    <div class="ai-suggestion" onclick="hist=['home']; openAnswer('${finalCatId}', ${finalIdx})">
      ${finalCat.icon} ${finalCat.title} → ${finalItem.q}
    </div>`;
}

// Build home
function buildHome() {
  const grid = document.getElementById('categories-grid');
  CATS.forEach(cat => {
    const card = document.createElement('div');
    card.className = 'category-card';
    card.style.setProperty('--card-color', cat.color);
    card.innerHTML = `<div class="category-icon">${cat.icon}</div><div class="category-title">${cat.title}</div><div class="category-count">${cat.items.length} procedimiento${cat.items.length!==1?'s':''}</div>`;
    card.onclick = () => openCategory(cat.id);
    grid.appendChild(card);
  });
}

buildHome();
showScreen('home');
</script>
